<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#74121c"><meta name="description" content="毛泽东语录闪卡。随手读一句，收藏有启发的文字，查看出处。">
<title>毛主席语录 · 闪卡</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css"><script src="data.js" defer></script><script src="landscapes.js" defer></script><script src="script.js" defer></script>
</head>
<body>
<div class="corner-decoration top-left"></div><div class="corner-decoration top-right"></div><div class="corner-decoration bottom-left"></div><div class="corner-decoration bottom-right"></div>
<div class="shell">
<header class="masthead"><h1>毛主席语录</h1><p class="edition">毛泽东思想闪卡集</p></header>
<main class="layout">

<section class="reader" aria-label="语录阅读器">
<div class="reader-bar"><label for="category" class="sr-only">阅读主题</label><select id="category"><option value="all">全部主题</option></select><button id="collection" class="quiet-button" type="button" aria-pressed="false">我的收藏 <span id="favoriteCount">0</span></button></div>
<div class="card-stack"><button id="card" class="card" type="button" aria-label="阅读语录，点击下一张">
<img id="artworkBackdrop" class="artwork-backdrop" src="assets/photos/great-wall.jpg" alt="" aria-hidden="true">
<img id="artwork" class="artwork" src="assets/photos/great-wall.jpg" alt="" aria-hidden="true">
<span class="card-top"><span id="cardCategory" class="card-category">调查研究</span><span id="cardNumber" class="card-number">023</span></span>
<span id="quote" class="quote" aria-live="polite">没有调查，没有发言权。</span>
<span id="source" class="source">1930年5月，《反对本本主义》</span><span class="card-bottom"><span>轻点卡片 · 下一条</span><span aria-hidden="true">↔</span></span></button></div>
<div id="empty" class="empty" hidden><p>这里还没有收藏。</p><p>遇到有启发的句子，点一下「收藏」。</p><button id="backToAll" type="button">继续阅读</button></div>
<div class="reading-status"><span id="progressText" role="status">正在加载语录</span><span id="photoLocation" class="art-credit">北京 · 慕田峪长城</span></div>
<div class="progress-bar" role="progressbar" aria-label="已读语录" aria-valuemin="0" aria-valuemax="102" aria-valuenow="1"><div id="progressFill" class="progress-fill"></div></div>
<div class="actions"><button id="previous" type="button" aria-label="上一张">←</button><button id="favorite" type="button" aria-pressed="false">＋ 收藏</button><button id="showSource" type="button" aria-expanded="false" aria-controls="sourcePanel">查看出处</button><button id="next" class="primary" type="button">下一张 <span aria-hidden="true">→</span></button></div>
<section id="sourcePanel" class="source-panel" aria-label="语录出处" hidden><p class="eyebrow">语录出处</p><p id="sourceDetail"></p><a id="originalSource" class="original-source" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a><p id="verificationNote" class="source-note"></p><p class="source-note">语录为摘录，理解时请结合原文背景。</p><p id="photoAttribution" class="photo-attribution"></p><button id="closeSource" type="button" class="quiet-button">收起 ↑</button></section>
<p id="notice" class="notice" role="status"></p><p class="keyboard-hint">← → 切换 · 空格下一张 · S 查看出处</p>
</section>
</main>
<footer class="site-footer"><span>一句话，一个新的视角。</span><span>知行 / 随身阅读</span></footer>
</div><noscript><p class="noscript">请启用 JavaScript 以使用闪卡。语录内容保存在本站，无需外部图片服务。</p></noscript>
</body></html>

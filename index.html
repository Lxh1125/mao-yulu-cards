<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151618"><meta name="description" content="毛泽东语录闪卡。随手读一句，收藏有启发的文字，查看出处。">
<title>知行 · 毛泽东语录闪卡</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css"><script src="data.js" defer></script><script src="script.js" defer></script>
</head>
<body>
<div class="shell">
<header class="masthead"><a class="brand" href="./" aria-label="知行首页">知<span> / </span>行</a><span class="edition">毛泽东语录闪卡</span></header>
<main class="layout">
<section class="intro" aria-label="阅读简介"><p class="eyebrow">READ. REFLECT. ACT.</p><h1>读一句。<br>想深一点。</h1><p class="intro-copy">把片刻留给阅读，<br>把启发带进生活。</p><div class="intro-rule"></div><p class="intro-foot">轻点换卡 · 随时开始</p></section>
<section class="reader" aria-label="语录阅读器">
<div class="reader-bar"><label for="category" class="sr-only">阅读主题</label><select id="category"><option value="all">全部主题</option></select><button id="collection" class="quiet-button" type="button" aria-pressed="false">我的收藏 <span id="favoriteCount">0</span></button></div>
<div class="card-stack"><button id="card" class="card" type="button" aria-label="阅读语录，点击下一张">
<img id="artwork" class="artwork" src="assets/mountains.svg" alt="" aria-hidden="true">
<span class="card-top"><span id="cardCategory" class="card-category">调查研究</span><span id="cardNumber" class="card-number">023</span></span>
<span id="quote" class="quote" aria-live="polite">没有调查就没有发言权。</span>
<span id="source" class="source">1930年5月，《反对本本主义》</span><span class="card-bottom"><span>轻点下一张</span><span aria-hidden="true">↗</span></span></button></div>
<div id="empty" class="empty" hidden><p>这里还没有收藏。</p><p>遇到有启发的句子，点一下「收藏」。</p><button id="backToAll" type="button">继续阅读</button></div>
<div class="reading-status"><span id="progressText" role="status">已读 1 / 150</span><span class="art-credit">原创山水插画 · 非历史照片</span></div>
<div class="actions"><button id="previous" type="button" aria-label="上一张">←</button><button id="favorite" type="button" aria-pressed="false">＋ 收藏</button><button id="showSource" type="button" aria-expanded="false" aria-controls="sourcePanel">查看出处</button><button id="next" class="primary" type="button">下一张 <span aria-hidden="true">→</span></button></div>
<section id="sourcePanel" class="source-panel" aria-label="语录出处" hidden><p class="eyebrow">语录出处</p><p id="sourceDetail"></p><p class="source-note">语录为摘录，理解时请结合原文背景。</p><button id="closeSource" type="button" class="quiet-button">收起 ↑</button></section>
<p id="notice" class="notice" role="status"></p><p class="keyboard-hint">← → 切换 · 空格下一张 · S 查看出处</p>
</section>
</main>
<footer class="site-footer"><span>一句话，一个新的视角。</span><span>知行 / 随身阅读</span></footer>
</div><noscript><p class="noscript">请启用 JavaScript 以使用闪卡。语录内容保存在本站，无需外部图片服务。</p></noscript>
</body></html>
